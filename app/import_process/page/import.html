<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掌柜智库 · 文档导入</title>
<script>
  // 在首帧渲染前定主题，避免深色模式下的白屏闪烁（FOUC）
  // 与问答页共用 kb-theme，两页主题保持一致
  (function () {
    try {
      var saved = localStorage.getItem('kb-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
    } catch (e) { /* localStorage 不可用时用默认浅色 */ }
  })();
</script>
<style>
  /* ============================================================
     设计令牌（与问答页 chat.html 同一套）
     白昼：冷调纸白 + 墨绿（verdigris）
     黑夜：深墨底 + 铜锈绿
     ============================================================ */
  :root {
    --font-sans: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", "Cascadia Mono", ui-monospace, Consolas, monospace;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 16px;

    --ease: cubic-bezier(.2, .7, .3, 1);
  }

  html[data-theme="light"] {
    --bg:            #ECEDE9;
    --surface:       #F5F6F2;
    --surface-2:     #FFFFFE;
    --line:          #D3D7CD;
    --line-strong:   #B7BEB0;
    --ink:           #171A16;
    --ink-2:         #3E4640;
    --ink-dim:       #5F695F;
    --accent:        #1C6A5A;
    --accent-ink:    #F2F7F4;
    --accent-soft:   rgba(28, 106, 90, .09);
    --live:          #8F5A0E;
    --done:          var(--accent);
    --fail:          #B23A48;
    --shadow:        0 1px 2px rgba(20,26,20,.05), 0 8px 24px -12px rgba(20,26,20,.16);
    --grid-line:     rgba(23, 26, 22, .045);
  }

  html[data-theme="dark"] {
    --bg:            #0C0F0D;
    --surface:       #141815;
    --surface-2:     #1A1F1B;
    --line:          #28302A;
    --line-strong:   #3A453C;
    --ink:           #E4E9E3;
    --ink-2:         #B3BDB4;
    --ink-dim:       #818B82;
    --accent:        #4FBF9C;
    --accent-ink:    #07130F;
    --accent-soft:   rgba(79, 191, 156, .13);
    --live:          #D9A441;
    --done:          var(--accent);
    --fail:          #E06C7A;
    --shadow:        0 1px 2px rgba(0,0,0,.35), 0 12px 32px -16px rgba(0,0,0,.7);
    --grid-line:     rgba(228, 233, 227, .035);
  }

  /* ============================================================
     基础
     ============================================================ */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    /* 极淡的图纸网格：呼应"技术手册"的底纹 */
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14.5px;
    line-height: 1.75;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: var(--font-mono); font-variant-ligatures: none; }

  /* 中文疏排字距：用于眉标 */
  .eyebrow {
    font-size: 10.5px; letter-spacing: .34em; text-transform: uppercase;
    color: var(--ink-dim); font-family: var(--font-mono);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--r-sm);
  }

  code {
    font-family: var(--font-mono); font-size: .92em;
    background: var(--accent-soft); color: var(--accent);
    padding: 1px 5px; border-radius: 4px;
  }

  /* ============================================================
     顶栏
     ============================================================ */
  .topbar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 16px;
    padding: 13px 22px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .mark {
    width: 27px; height: 27px; border-radius: 7px;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 13px;
    flex-shrink: 0;
  }
  .brand .name { font-weight: 600; font-size: 15px; letter-spacing: .02em; }
  .brand .sub { font-size: 11px; color: var(--ink-dim); margin-top: -3px; }
  .topbar .spacer { flex: 1; }

  .ctl-group { display: flex; align-items: center; gap: 9px; }

  /* 主题切换 */
  .theme-btn {
    width: 32px; height: 32px; flex-shrink: 0;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--ink-2);
    display: grid; place-items: center; cursor: pointer;
    transition: color .18s, border-color .18s, background .18s;
  }
  .theme-btn:hover { color: var(--accent); border-color: var(--accent); }
  .theme-btn svg { width: 15px; height: 15px; }
  html[data-theme="light"] .theme-btn .i-sun { display: none; }
  html[data-theme="dark"]  .theme-btn .i-moon { display: none; }

  /* 连接状态 */
  .conn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-family: var(--font-mono);
    padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--line);
    color: var(--ink-dim); background: var(--surface-2);
    white-space: nowrap;
  }
  .conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-dim); flex-shrink: 0; }
  .conn.on  { border-color: color-mix(in srgb, var(--done) 40%, transparent); color: var(--done); }
  .conn.on .dot { background: var(--done); }
  .conn.busy { border-color: color-mix(in srgb, var(--live) 45%, transparent); color: var(--live); }
  .conn.busy .dot { background: var(--live); animation: pulse 1.1s ease-in-out infinite; }
  .conn.err { border-color: color-mix(in srgb, var(--fail) 45%, transparent); color: var(--fail); }
  .conn.err .dot { background: var(--fail); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  /* ============================================================
     主区
     ============================================================ */
  #main { flex: 1; overflow-y: auto; }
  .column { max-width: 880px; margin: 0 auto; padding: 30px 22px 72px; }

  /* 页头 */
  .page-head { margin-bottom: 24px; }
  .page-head .eyebrow { margin-bottom: 8px; }
  .page-head h1 {
    font-size: 23px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em;
  }
  .page-head p { color: var(--ink-dim); margin: 0; font-size: 13.5px; max-width: 560px; }

  /* 卡片 */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .card-head {
    display: flex; align-items: center; gap: 9px;
    padding: 13px 18px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface-2) 55%, var(--surface));
  }
  .card-head h2 {
    font-size: 13.5px; font-weight: 600; margin: 0;
    letter-spacing: .01em;
    display: flex; align-items: center; gap: 8px;
  }
  .card-head .spacer { flex: 1; }
  .card-body { padding: 18px; }

  /* 状态圆点 */
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .dot.warn { background: var(--live); }
  .dot.err  { background: var(--fail); }
  .dot.ok   { background: var(--done); }

  /* ============================================================
     拖拽区
     ============================================================ */
  #drop {
    border: 1.5px dashed var(--line-strong);
    border-radius: var(--r-md);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s var(--ease), background .2s var(--ease);
    background: var(--surface-2);
  }
  #drop:hover, #drop.over {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  #drop .ico {
    width: 26px; height: 26px; margin-bottom: 10px;
    color: var(--ink-dim);
    transition: color .2s;
  }
  #drop:hover .ico, #drop.over .ico { color: var(--accent); }
  #drop .main { font-size: 14px; margin-bottom: 4px; }
  #drop .hint { font-size: 12px; color: var(--ink-dim); }

  /* 文件行 */
  .files { margin-top: 14px; }
  .file-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border: 1px solid var(--line);
    border-radius: var(--r-sm); margin-bottom: 8px; background: var(--surface-2);
  }
  .file-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row .size { color: var(--ink-dim); font-size: 12px; font-family: var(--font-mono); }
  .file-row .rm {
    color: var(--ink-dim); cursor: pointer; padding: 0 4px;
    background: none; border: none; font-size: 15px; line-height: 1;
    transition: color .18s;
  }
  .file-row .rm:hover { color: var(--fail); }

  /* ============================================================
     按钮
     ============================================================ */
  button { font-family: inherit; }

  button.primary {
    background: var(--accent); color: var(--accent-ink); border: none;
    padding: 10px 22px; border-radius: var(--r-md); font-size: 14px;
    cursor: pointer; font-weight: 500;
    transition: transform .18s var(--ease), opacity .18s;
  }
  button.primary:hover:not(:disabled) { transform: translateY(-1px); }
  button.primary:disabled { opacity: .4; cursor: not-allowed; }

  button.ghost {
    background: none; color: var(--live); border: 1px solid var(--live);
    padding: 7px 14px; border-radius: var(--r-sm); font-size: 13px; cursor: pointer;
    transition: background .18s;
  }
  button.ghost:hover:not(:disabled) { background: color-mix(in srgb, var(--live) 12%, transparent); }
  button.ghost:disabled { opacity: .45; cursor: not-allowed; }

  button.danger {
    background: none; color: var(--fail); border: 1px solid var(--fail);
    padding: 4px 12px; border-radius: var(--r-sm); font-size: 12px; cursor: pointer;
    white-space: nowrap; transition: background .18s;
  }
  button.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--fail) 12%, transparent); }
  button.danger:disabled { opacity: .45; cursor: not-allowed; }

  button.refresh {
    background: none; border: 1px solid var(--line);
    color: var(--ink-dim); border-radius: var(--r-sm); padding: 2px 9px;
    font-size: 13px; cursor: pointer; line-height: 1.4;
    transition: color .18s, border-color .18s;
  }
  button.refresh:hover { color: var(--accent); border-color: var(--accent); }

  /* 上传进度条 */
  .bar {
    height: 3px; background: var(--surface-2); border-radius: 2px;
    overflow: hidden; margin-top: 14px; display: none;
  }
  .bar.on { display: block; }
  .bar span {
    display: block; height: 100%; width: 0;
    background: var(--accent); transition: width .2s var(--ease);
  }
  .submit-row { margin-top: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  /* ============================================================
     即时提示条
     ============================================================ */
  .notice {
    padding: 12px 16px; border-radius: var(--r-md); margin-bottom: 16px;
    font-size: 13px; line-height: 1.7;
    border: 1px solid transparent;
    border-left-width: 3px;
  }
  .notice.info { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .notice.warn { background: color-mix(in srgb, var(--live) 11%, transparent); border-color: var(--live); color: var(--live); }
  .notice.err  { background: color-mix(in srgb, var(--fail) 11%, transparent); border-color: var(--fail); color: var(--fail); }
  .notice.ok   { background: color-mix(in srgb, var(--done) 11%, transparent); border-color: var(--done); color: var(--done); }
  .notice b { font-weight: 600; }

  /* ============================================================
     重复 / 失败条目
     ============================================================ */
  .dup-item {
    border: 1px solid var(--line); border-left: 3px solid var(--live);
    background: var(--surface-2);
    border-radius: var(--r-md); padding: 14px; margin-bottom: 10px;
  }
  .dup-item:last-child { margin-bottom: 0; }
  .dup-item .title { font-weight: 600; color: var(--live); margin-bottom: 6px; font-size: 13.5px; }
  .dup-item .meta { font-size: 12.5px; color: var(--ink-dim); line-height: 1.9; }
  .dup-item .meta b { color: var(--ink); font-weight: 500; font-family: var(--font-mono); }
  .dup-actions { margin-top: 12px; }

  .err-item {
    border: 1px solid var(--line); border-left: 3px solid var(--fail);
    background: var(--surface-2);
    border-radius: var(--r-md); padding: 11px 13px; margin-bottom: 8px; font-size: 13px;
  }
  .err-item:last-child { margin-bottom: 0; }
  .err-item b { color: var(--fail); }

  /* ============================================================
     签名元素：导入管线
     把「一份文档依次经过 7 个处理阶段」这个真实结构画出来，
     已经过的阶段填成品牌绿，正在跑的用琥珀色呼吸
     ============================================================ */
  .task {
    border: 1px solid var(--line); border-radius: var(--r-md);
    margin-bottom: 10px; background: var(--surface-2); overflow: hidden;
  }
  .task:last-child { margin-bottom: 0; }
  .task .head {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 11px 14px; border-bottom: 1px solid var(--line);
  }
  .task .fname {
    font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13.5px;
  }
  .badge {
    font-size: 11px; padding: 2px 9px; border-radius: 20px; white-space: nowrap;
    font-family: var(--font-mono);
    border: 1px solid transparent; flex-shrink: 0;
  }
  .badge.processing { background: color-mix(in srgb, var(--live) 14%, transparent); color: var(--live); border-color: color-mix(in srgb, var(--live) 40%, transparent); }
  .badge.completed  { background: color-mix(in srgb, var(--done) 14%, transparent); color: var(--done); border-color: color-mix(in srgb, var(--done) 40%, transparent); }
  .badge.failed     { background: color-mix(in srgb, var(--fail) 14%, transparent); color: var(--fail); border-color: color-mix(in srgb, var(--fail) 40%, transparent); }
  .badge.pending    { background: color-mix(in srgb, var(--ink-dim) 14%, transparent); color: var(--ink-dim); border-color: var(--line); }

  .stages { display: flex; flex-wrap: wrap; gap: 7px; padding: 12px 14px; }

  .node {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px 5px 9px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--surface);
    font-size: 11.5px; color: var(--ink-dim);
    font-family: var(--font-mono);
    transition: all .2s var(--ease);
  }
  .node .mark {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--line-strong); flex-shrink: 0;
    transition: background .2s;
  }
  .node.done {
    color: var(--ink); border-color: color-mix(in srgb, var(--done) 32%, var(--line));
    background: color-mix(in srgb, var(--done) 7%, var(--surface));
  }
  .node.done .mark { background: var(--done); }
  .node.live {
    color: var(--live); border-color: color-mix(in srgb, var(--live) 45%, transparent);
    background: color-mix(in srgb, var(--live) 9%, var(--surface));
  }
  .node.live .mark { background: var(--live); animation: pulse 1.1s ease-in-out infinite; }

  /* ============================================================
     已导入文档表
     ============================================================ */
  table.docs { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.docs th {
    text-align: left; font-weight: 500; color: var(--ink-dim);
    padding: 7px 8px; border-bottom: 1px solid var(--line);
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    font-family: var(--font-mono);
  }
  table.docs td { padding: 10px 8px; border-bottom: 1px solid var(--line); }
  table.docs tr:last-child td { border-bottom: none; }
  table.docs tbody tr { transition: background .18s; }
  table.docs tbody tr:hover td { background: var(--accent-soft); }
  td.docname { font-weight: 500; }
  td.num { color: var(--ink-dim); white-space: nowrap; font-family: var(--font-mono); font-size: 12px; }
  td.act { text-align: right; }

  .revoke-result {
    margin-top: 14px; padding: 13px 15px; border-radius: var(--r-md); font-size: 13px;
    border: 1px solid var(--line); background: var(--surface-2); line-height: 2;
  }
  .revoke-result .k { color: var(--ink-dim); display: inline-block; min-width: 96px; }
  .revoke-result .k + span, .revoke-result b { font-family: var(--font-mono); }
  .revoke-warn { color: var(--fail); font-weight: 600; margin-bottom: 8px; }
  .revoke-ok { color: var(--done); font-weight: 600; margin-bottom: 8px; }
  .revoke-paths {
    margin: 6px 0 0 96px; color: var(--ink-dim); font-size: 11.5px;
    font-family: var(--font-mono); line-height: 1.7; word-break: break-all;
  }
  .revoke-input {
    margin-left: 8px; padding: 7px 11px; border-radius: var(--r-sm);
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    font-family: var(--font-mono); font-size: 12.5px; width: 240px;
    transition: border-color .18s, box-shadow .18s;
  }
  .revoke-input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .revoke-actions { margin-top: 14px; display: flex; gap: 10px; }
  button.plain {
    background: none; color: var(--ink-dim);
    border: 1px solid var(--line);
    padding: 7px 14px; border-radius: var(--r-sm); font-size: 13px; cursor: pointer;
    transition: color .18s, border-color .18s;
  }
  button.plain:hover { color: var(--ink); border-color: var(--line-strong); }

  .empty { color: var(--ink-dim); font-size: 13px; }
  .hidden { display: none !important; }

  /* 滚动条 */
  #main::-webkit-scrollbar { width: 9px; }
  #main::-webkit-scrollbar-thumb {
    background: var(--line-strong); border-radius: 5px;
    border: 2px solid var(--bg);
  }
  #main::-webkit-scrollbar-thumb:hover { background: var(--ink-dim); }
  #main::-webkit-scrollbar-track { background: transparent; }

  /* 响应式 */
  @media (max-width: 620px) {
    .column { padding-left: 14px; padding-right: 14px; }
    .topbar { padding: 11px 14px; gap: 10px; }
    .brand .sub { display: none; }
    .card-body { padding: 14px; }
    .revoke-input { width: 100%; margin: 6px 0 0; }
    .revoke-paths { margin-left: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark">掌</div>
    <div>
      <div class="name">掌柜智库</div>
      <div class="sub">文档导入</div>
    </div>
  </div>
  <span class="spacer"></span>
  <div class="ctl-group">
    <button class="theme-btn" id="themeBtn" title="切换昼夜模式" aria-label="切换昼夜模式">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">连接中</span></span>
  </div>
</header>

<main id="main">
<div class="column">

  <div class="page-head">
    <div class="eyebrow">Ingest</div>
    <h1>知识库文档导入</h1>
    <p>上传 PDF / Markdown，自动完成解析、图片处理、切分、向量化并入库。重复文档将被自动识别。</p>
  </div>

  <!-- 上传 -->
  <div class="card">
    <div class="card-head"><h2><span class="dot"></span>选择文件</h2></div>
    <div class="card-body">
      <div id="drop">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/></svg>
        <div class="main">点击选择文件，或拖拽到此处</div>
        <div class="hint">支持 .pdf / .md，单个文件不超过 200MB</div>
      </div>
      <input type="file" id="picker" multiple accept=".pdf,.md" class="hidden">
      <div class="files" id="fileList"></div>
      <div class="bar" id="bar"><span id="barFill"></span></div>
      <div class="submit-row">
        <button class="primary" id="submit" disabled>开始导入</button>
        <span class="empty" id="statusText"></span>
      </div>
    </div>
  </div>

  <!-- 即时反馈 -->
  <div id="notice" class="notice hidden"></div>

  <!-- 重复文档 -->
  <div class="card hidden" id="dupPanel">
    <div class="card-head"><h2><span class="dot warn"></span>检测到重复文档</h2></div>
    <div class="card-body"><div id="dupList"></div></div>
  </div>

  <!-- 未受理 -->
  <div class="card hidden" id="errPanel">
    <div class="card-head"><h2><span class="dot err"></span>未能受理的文件</h2></div>
    <div class="card-body"><div id="errList"></div></div>
  </div>

  <!-- 导入进度 -->
  <div class="card hidden" id="taskPanel">
    <div class="card-head"><h2><span class="dot"></span>导入管线</h2></div>
    <div class="card-body"><div id="taskList"></div></div>
  </div>

  <!-- 已导入文档 -->
  <div class="card">
    <div class="card-head">
      <h2><span class="dot ok"></span>已导入文档</h2>
      <span class="spacer"></span>
      <button class="refresh" id="refreshDocs" title="刷新列表" aria-label="刷新列表">↻</button>
    </div>
    <div class="card-body">
      <div id="docList"><div class="empty">正在加载…</div></div>
      <!-- 撤回确认与结果放在 docList 之外：刷新列表时不会把它冲掉 -->
      <div id="revokeBox"></div>
    </div>
  </div>

</div>
</main>

<script>
const API = '';
const $ = (id) => document.getElementById(id);
let picked = [];        // 待上传文件
let tasks = {};         // task_id -> {filename, timer}

/* ---------- 主题 ---------- */
$('themeBtn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('kb-theme', next); } catch (e) {}
};

/* ---------- 连接状态 ---------- */
function setConn(state, text) {
  const el = $('conn');
  el.className = 'conn' + (state ? ' ' + state : '');
  $('connText').textContent = text;
}

/* ---------- 文件选择 ---------- */
$('drop').addEventListener('click', () => $('picker').click());
$('picker').addEventListener('change', (e) => addFiles([...e.target.files]));

['dragenter', 'dragover'].forEach(ev =>
  $('drop').addEventListener(ev, (e) => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(ev =>
  $('drop').addEventListener(ev, (e) => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', (e) => addFiles([...e.dataTransfer.files]));

function addFiles(list) {
  const ok = ['.pdf', '.md'];
  for (const f of list) {
    const ext = f.name.slice(f.name.lastIndexOf('.')).toLowerCase();
    if (!ok.includes(ext)) { alert(`不支持的文件类型：${f.name}\n仅支持 PDF / Markdown`); continue; }
    if (picked.some(p => p.name === f.name && p.size === f.size)) continue;
    picked.push(f);
  }
  renderFiles();
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function renderFiles() {
  const box = $('fileList');
  box.innerHTML = picked.map((f, i) => `
    <div class="file-row">
      <span class="name">${esc(f.name)}</span>
      <span class="size">${fmtSize(f.size)}</span>
      <button class="rm" data-i="${i}" title="移除">✕</button>
    </div>`).join('');
  box.querySelectorAll('.rm').forEach(b => b.onclick = () => {
    picked.splice(Number(b.dataset.i), 1); renderFiles();
  });
  $('submit').disabled = picked.length === 0;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- 即时提示条 ---------- */
let noticeTimer = null;
function showNotice(kind, html, keep) {
  const el = $('notice');
  el.className = 'notice ' + kind;
  el.innerHTML = html;
  // 自动滚到提示条位置，避免用户在下方视野外看不到反馈
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (noticeTimer) { clearTimeout(noticeTimer); noticeTimer = null; }
  if (!keep) {
    noticeTimer = setTimeout(() => { el.className = 'notice hidden'; }, 8000);
  }
}

/* ---------- 上传 ---------- */
$('submit').onclick = () => doUpload(picked, false);

function doUpload(files, force) {
  if (!files.length) {
    showNotice('warn', '请先选择要导入的文件');
    return;
  }
  const fd = new FormData();
  files.forEach(f => fd.append('files', f, f.name));
  fd.append('force', force ? 'true' : 'false');

  const xhr = new XMLHttpRequest();
  xhr.open('POST', API + '/upload');

  // 进度条
  $('bar').classList.add('on');
  $('barFill').style.width = '0';
  $('statusText').textContent = force ? '重新上传中…' : '上传中…';
  $('submit').disabled = true;
  setConn('busy', '上传中');
  showNotice('info', `正在上传 ${files.length} 个文件…`, true);

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      $('barFill').style.width = (e.loaded / e.total * 100).toFixed(0) + '%';
    }
  };

  xhr.onload = () => {
    $('bar').classList.remove('on');
    $('barFill').style.width = '0';
    $('submit').disabled = picked.length === 0;

    let res;
    try { res = JSON.parse(xhr.responseText); }
    catch {
      $('statusText').textContent = '响应解析失败';
      setConn('err', '异常');
      showNotice('err', `响应解析失败（HTTP ${xhr.status}）：${esc(xhr.responseText.slice(0, 200))}`);
      return;
    }

    if (xhr.status !== 200) {
      $('statusText').textContent = '上传失败';
      setConn('err', '失败');
      const detail = res && res.detail ? res.detail : xhr.statusText;
      showNotice('err', `<b>上传失败（HTTP ${xhr.status}）</b><br>${esc(String(detail))}`);
      return;
    }
    setConn('on', '已连接');
    handleResponse(res, files);
  };

  xhr.onerror = () => {
    $('bar').classList.remove('on');
    $('statusText').textContent = '网络错误';
    $('submit').disabled = picked.length === 0;
    setConn('err', '离线');
    showNotice('err',
      '<b>请求发送失败</b><br>' +
      '请确认后端服务已启动：<code>.venv/Scripts/python.exe -m app.import_process.api.file_import_service</code>');
  };

  xhr.send(fd);
}

/* ---------- 处理响应 ---------- */
function handleResponse(res, uploadedFiles) {
  // 1. 重复文档
  const dups = res.duplicates || [];
  if (dups.length) {
    $('dupPanel').classList.remove('hidden');
    showNotice('warn',
      `检测到 <b>${dups.length}</b> 个文件已经导入过，已跳过。<br>` +
      '如需重新导入，请在下方「检测到重复文档」区域点击「仍要重新导入」。',
      true);
    $('dupList').innerHTML = dups.map(d => `
      <div class="dup-item">
        <div class="title">⚠ ${esc(d.filename)} 已导入过</div>
        <div class="meta">
          识别产品：<b>${esc(d.item_name || '未识别')}</b><br>
          切片数量：<b>${d.chunk_count || 0}</b> 条<br>
          导入时间：<b>${esc(d.imported_at || '-')}</b>
          状态：<b>${esc(d.status || '-')}</b>
        </div>
        <div class="dup-actions">
          <button class="ghost" data-name="${esc(d.filename)}">仍要重新导入</button>
        </div>
      </div>`).join('');

    // 强制重导：拿原始 File 对象重新提交
    $('dupList').querySelectorAll('.ghost').forEach(btn => {
      btn.onclick = () => {
        const target = uploadedFiles.find(f => f.name === btn.dataset.name);
        if (!target) { alert('原始文件已不在选择列表，请重新选择后再试'); return; }
        $('statusText').textContent = `正在强制重新导入 ${target.name}…`;
        doUpload([target], true);
      };
    });
  } else {
    $('dupPanel').classList.add('hidden');
  }

  // 2. 未受理的文件
  const failed = res.failed || [];
  if (failed.length) {
    $('errPanel').classList.remove('hidden');
    $('errList').innerHTML = failed.map(f =>
      `<div class="err-item"><b>${esc(f.filename)}</b> — ${esc(f.reason)}</div>`).join('');
  } else {
    $('errPanel').classList.add('hidden');
  }

  // 3. 已受理的任务，开始轮询进度
  const ids = res.task_ids || [];
  if (ids.length) {
    $('taskPanel').classList.remove('hidden');
    ids.forEach((id, i) => {
      const fname = (uploadedFiles[i] || {}).name || id.slice(0, 8);
      tasks[id] = { filename: fname };
      renderTask(id, { status: 'pending', done_list: [], running_list: [] });
      pollTask(id);
    });
  }

  const parts = [];
  if (ids.length) parts.push(`受理 ${ids.length} 个`);
  if (dups.length) parts.push(`跳过 ${dups.length} 个重复`);
  if (failed.length) parts.push(`${failed.length} 个未受理`);
  const summary = parts.join('，') || '无文件可处理';
  $('statusText').textContent = summary;

  // 全部结果都已反馈，统一给一个总结提示（重复/失败的提示上面已单独给出）
  if (!dups.length && !failed.length && ids.length) {
    showNotice('ok', `已受理 <b>${ids.length}</b> 个文件，正在后台导入，进度见下方。`, true);
  }

  // 从待上传列表移除本次所有已处理的文件（受理/重复/失败），避免重复提交
  // 注意：不能用 slice(0, ids.length) 按位置取，因为重复的文件会被跳过、位置对不上
  const handledNames = new Set([
    ...ids.map((_, i) => (uploadedFiles[i] || {}).name).filter(Boolean),
    ...dups.map(d => d.filename),
    ...failed.map(f => f.filename),
  ]);
  // 受理的文件名以 tasks 记录为准（上传时用的是 File 对象的 name）
  Object.values(tasks).forEach(t => handledNames.add(t.filename));
  if (handledNames.size) {
    picked = picked.filter(f => !handledNames.has(f.name));
    renderFiles();
  }
}

/* ---------- 任务进度轮询 ---------- */
function pollTask(id) {
  const tick = async () => {
    try {
      const r = await fetch(`${API}/status/${id}`);
      const d = await r.json();
      renderTask(id, d);
      if (d.status === 'completed' || d.status === 'failed') {
        clearInterval(tasks[id].timer);
        delete tasks[id].timer;
        // 有任务跑完就刷新文档列表，让新入库的文档及时出现
        refreshDocTable();
      }
    } catch (e) { /* 网络抖动忽略，下次再试 */ }
  };
  tick();
  tasks[id].timer = setInterval(tick, 2000);
}

const STATUS_CN = { pending: '排队中', processing: '处理中', completed: '已完成', failed: '失败' };

// 导入管线的完整阶段序列。PDF 走 MinerU 解析，多一步「PDF转Markdown」；
// MD 直接进图片处理。按实际上报过的节点判断走的是哪条路径。
const STAGES_PDF = ['开始上传文件', '检查文件', 'PDF转Markdown', 'Markdown图片处理', '文档切分', '主体名称识别', '向量生成', '导入向量库'];
const STAGES_MD  = ['开始上传文件', '检查文件', 'Markdown图片处理', '文档切分', '主体名称识别', '向量生成', '导入向量库'];

function renderTask(id, d) {
  let box = document.getElementById('task-' + id);
  const label = STATUS_CN[d.status] || d.status || '未知';
  const done = d.done_list || [];
  const running = d.running_list || [];

  // 判断路径：出现过 PDF 解析阶段就按 PDF 管线展示
  const isPdf = done.includes('PDF转Markdown') || running.includes('PDF转Markdown');
  const stages = isPdf ? STAGES_PDF : STAGES_MD;

  // 已完成的阶段可能不在预设序列里（节点名变更等），追加到末尾以免丢失信息
  const extra = done.filter(n => !stages.includes(n));

  const nodes = [...stages, ...extra].map(name => {
    let cls = '';
    if (done.includes(name)) cls = 'done';
    else if (running.includes(name)) cls = 'live';
    return `<span class="node ${cls}"><span class="mark"></span>${esc(name)}</span>`;
  }).join('');

  const html = `
    <div class="head">
      <span class="fname">${esc(tasks[id].filename)}</span>
      <span class="badge ${esc(d.status || 'pending')}">${esc(label)}</span>
    </div>
    <div class="stages">${nodes || '<span class="node">等待开始…</span>'}</div>`;

  if (!box) {
    box = document.createElement('div');
    box.className = 'task';
    box.id = 'task-' + id;
    $('taskList').prepend(box);
  }
  box.innerHTML = html;
}

renderFiles();

/* ---------- 已导入文档列表 ---------- */
async function loadDocuments() {
  const box = $('docList');
  box.innerHTML = '<div class="empty">正在加载…</div>';
  try {
    const r = await fetch('/documents');
    const d = await r.json();
    setConn('on', '已连接');
    const docs = d.documents || [];
    if (!docs.length) {
      box.innerHTML = '<div class="empty">还没有已导入的文档</div>';
      return;
    }
    renderDocTable(docs);
  } catch (e) {
    box.innerHTML = '<div class="empty">加载失败：' + esc(String(e)) + '</div>';
    setConn('err', '离线');
  }
}

/* 只重新渲染表格，保留 revokeBox 中的确认/结果内容 */
async function refreshDocTable() {
  try {
    const d = await (await fetch('/documents')).json();
    renderDocTable(d.documents || []);
  } catch (e) { /* 刷新失败不打扰用户，保留现有表格 */ }
}

function renderDocTable(docs) {
  const box = $('docList');
  if (!docs.length) {
    box.innerHTML = '<div class="empty">还没有已导入的文档</div>';
    return;
  }
  box.innerHTML = `
    <table class="docs">
      <thead><tr>
        <th>文档</th><th>识别产品</th><th>切片</th><th>导入时间</th><th></th>
      </tr></thead>
      <tbody>${docs.map(x => `
        <tr>
          <td class="docname">${esc(x.file_title)}</td>
          <td>${esc(x.item_name || '—')}</td>
          <td class="num">${x.chunk_count}</td>
          <td class="num">${esc(x.imported_at || '—')}</td>
          <td class="act">
            <button class="danger" data-title="${esc(x.file_title)}">撤回</button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  box.querySelectorAll('.danger').forEach(b => {
    b.onclick = () => revokeFlow(b.dataset.title);
  });
}

/* 撤回流程：先预览待删内容 → 手动输入文档名确认 → 执行 */
async function revokeFlow(fileTitle) {
  const box = $('revokeBox');
  let preview;
  try {
    const r = await fetch('/documents/' + encodeURIComponent(fileTitle), { method: 'DELETE' });
    preview = await r.json();
  } catch (e) {
    showNotice('err', '撤回预览失败：' + esc(String(e)));
    return;
  }

  const paths = (preview.preview && preview.preview.local_paths) || [];
  box.innerHTML = `
    <div class="revoke-result">
      <div class="revoke-warn">⚠ 确认撤回「${esc(fileTitle)}」？此操作不可逆</div>
      <div><span class="k">将删除</span>Milvus 中该文档的全部切片与产品名</div>
      <div><span class="k"></span>去重记录（撤回后可重新上传）</div>
      <div><span class="k"></span>MinIO 中该文档的图片与原始文件</div>
      <div><span class="k"></span>本地产物 ${paths.length} 项</div>
      ${paths.length ? `<div class="revoke-paths">${paths.map(p => esc(p)).join('<br>')}</div>` : ''}
      <div style="margin-top:12px;">
        请输入文档名 <b>${esc(fileTitle)}</b> 以确认：
        <input id="confirmInput" class="revoke-input">
      </div>
      <div class="revoke-actions">
        <button class="danger" id="doRevoke" disabled>确认撤回</button>
        <button class="plain" id="cancelRevoke">取消</button>
      </div>
    </div>`;

  const input = $('confirmInput');
  const btn = $('doRevoke');
  // 必须与文档名完全一致（含首尾空格）才允许执行：删除不可逆，不做任何宽松匹配
  input.oninput = () => { btn.disabled = input.value !== fileTitle; };
  input.focus();
  $('cancelRevoke').onclick = () => { box.innerHTML = ''; };

  btn.onclick = async () => {
    btn.disabled = true;
    btn.textContent = '撤回中…';
    try {
      const r = await fetch(
        '/documents/' + encodeURIComponent(fileTitle) + '?confirm=true',
        { method: 'DELETE' }
      );
      const d = await r.json();
      const res = d.result || {};
      const m = (res.milvus && res.milvus.detail) || {};
      box.innerHTML = `
        <div class="revoke-result">
          <div class="${res.success ? 'revoke-ok' : 'revoke-warn'}">
            ${res.success ? '✓ 撤回完成' : '⚠ 撤回存在失败项，请检查日志'}
          </div>
          <div><span class="k">Milvus 切片</span>删除 ${m.chunks ?? '—'} 条</div>
          <div><span class="k">Milvus 产品名</span>删除 ${m.item_names ?? '—'} 条</div>
          <div><span class="k">去重记录</span>删除 ${(res.dedup && res.dedup.deleted) ?? '—'} 条</div>
          <div><span class="k">本地产物</span>删除 ${(res.local && res.local.deleted) ?? '—'} 项</div>
          <div><span class="k">MinIO</span>删除 ${(res.minio && res.minio.deleted) ?? '—'} 个对象</div>
        </div>`;
      showNotice(res.success ? 'ok' : 'err',
        res.success ? `文档「${esc(fileTitle)}」已撤回，可重新上传` : '撤回存在失败项，详见上方结果');
      // 只刷新列表数据，不替换 revokeBox —— 结果详情保留在页面上供查看
      refreshDocTable();
    } catch (e) {
      showNotice('err', '撤回失败：' + esc(String(e)));
      btn.disabled = false;
      btn.textContent = '确认撤回';
    }
  };
}

$('refreshDocs').onclick = loadDocuments;
loadDocuments();
</script>
</body>
</html>
