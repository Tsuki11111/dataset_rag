<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掌柜智库 · 知识库问答</title>
<script>
  // 在首帧渲染前定主题，避免深色模式下的白屏闪烁（FOUC）
  (function () {
    try {
      var saved = localStorage.getItem('kb-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
    } catch (e) { /* localStorage 不可用时用默认浅色 */ }
  })();
</script>
<style>
  /* ============================================================
     设计令牌
     白昼：冷调纸白 + 墨绿（verdigris）—— 取自产品说明书印刷与仪表铜绿的意象
     黑夜：深墨底 + 铜锈绿 —— 同一套语义的另一面，不是另一套配色
     ============================================================ */
  :root {
    /* 排版 */
    --font-sans: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", "Cascadia Mono", ui-monospace, Consolas, monospace;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 16px;

    --ease: cubic-bezier(.2, .7, .3, 1);
  }

  html[data-theme="light"] {
    --bg:            #ECEDE9;
    --surface:       #F5F6F2;
    --surface-2:     #FFFFFE;
    --line:          #D3D7CD;
    --line-strong:   #B7BEB0;
    --ink:           #171A16;
    --ink-2:         #3E4640;
    --ink-dim:       #5F695F;
    --accent:        #1C6A5A;
    --accent-ink:    #F2F7F4;
    --accent-soft:   rgba(28, 106, 90, .09);
    --live:          #8F5A0E;
    /* 完成态 = 品牌绿：管线被品牌色逐渐填满，完成时整条管线是绿的 */
    --done:          var(--accent);
    --fail:          #B23A48;
    --shadow:        0 1px 2px rgba(20,26,20,.05), 0 8px 24px -12px rgba(20,26,20,.16);
    --grid-line:     rgba(23, 26, 22, .045);
  }

  html[data-theme="dark"] {
    --bg:            #0C0F0D;
    --surface:       #141815;
    --surface-2:     #1A1F1B;
    --line:          #28302A;
    --line-strong:   #3A453C;
    --ink:           #E4E9E3;
    --ink-2:         #B3BDB4;
    --ink-dim:       #818B82;
    --accent:        #4FBF9C;
    --accent-ink:    #07130F;
    --accent-soft:   rgba(79, 191, 156, .13);
    --live:          #D9A441;
    --done:          var(--accent);
    --fail:          #E06C7A;
    --shadow:        0 1px 2px rgba(0,0,0,.35), 0 12px 32px -16px rgba(0,0,0,.7);
    --grid-line:     rgba(228, 233, 227, .035);
  }

  /* ============================================================
     基础
     ============================================================ */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    /* 极淡的图纸网格：呼应"技术手册"的底纹，不喧宾夺主 */
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14.5px;
    line-height: 1.75;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: var(--font-mono); font-variant-ligatures: none; }

  /* 中文疏排字距：用于眉标，是中文排版的古典手法 */
  .eyebrow {
    font-size: 10.5px; letter-spacing: .34em; text-transform: uppercase;
    color: var(--ink-dim); font-family: var(--font-mono);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--r-sm);
  }

  /* ============================================================
     顶栏
     ============================================================ */
  .topbar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 16px;
    padding: 13px 22px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .mark {
    width: 27px; height: 27px; border-radius: 7px;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 13px;
    flex-shrink: 0;
  }
  .brand .name { font-weight: 600; font-size: 15px; letter-spacing: .02em; }
  .brand .sub { font-size: 11px; color: var(--ink-dim); margin-top: -3px; }
  .topbar .spacer { flex: 1; }

  .ctl-group { display: flex; align-items: center; gap: 9px; }

  /* 流式开关 */
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track {
    width: 34px; height: 19px; border-radius: 10px;
    background: var(--line-strong); position: relative;
    transition: background .22s var(--ease);
    flex-shrink: 0;
  }
  .switch .track::after {
    content: ''; position: absolute; top: 2.5px; left: 2.5px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--surface-2);
    transition: transform .22s var(--ease);
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(15px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch .label { font-size: 12px; color: var(--ink-2); }

  /* 主题切换 */
  .theme-btn {
    width: 32px; height: 32px; flex-shrink: 0;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--ink-2);
    display: grid; place-items: center; cursor: pointer;
    transition: color .18s, border-color .18s, background .18s;
  }
  .theme-btn:hover { color: var(--accent); border-color: var(--accent); }
  .theme-btn svg { width: 15px; height: 15px; }
  html[data-theme="light"] .theme-btn .i-sun { display: none; }
  html[data-theme="dark"]  .theme-btn .i-moon { display: none; }

  /* 连接状态 */
  .conn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-family: var(--font-mono);
    padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--line);
    color: var(--ink-dim); background: var(--surface-2);
    white-space: nowrap;
  }
  .conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-dim); flex-shrink: 0; }
  .conn.on  { border-color: color-mix(in srgb, var(--done) 40%, transparent); color: var(--done); }
  .conn.on .dot { background: var(--done); }
  .conn.busy { border-color: color-mix(in srgb, var(--live) 45%, transparent); color: var(--live); }
  .conn.busy .dot { background: var(--live); animation: pulse 1.1s ease-in-out infinite; }
  .conn.err { border-color: color-mix(in srgb, var(--fail) 45%, transparent); color: var(--fail); }
  .conn.err .dot { background: var(--fail); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  /* ============================================================
     对话区
     ============================================================ */
  #chat { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .column { max-width: 860px; margin: 0 auto; padding: 30px 22px 20px; }

  /* 空状态：不写"暂无数据"，而是引导提问 */
  .empty-state { padding: 58px 0 40px; text-align: center; }
  .empty-state .eyebrow { margin-bottom: 14px; }
  .empty-state h2 {
    font-size: 23px; font-weight: 600; margin: 0 0 10px; letter-spacing: -.01em;
  }
  .empty-state p { color: var(--ink-dim); margin: 0 auto 26px; max-width: 430px; font-size: 13.5px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
  .suggestion {
    border: 1px solid var(--line); background: var(--surface-2);
    color: var(--ink-2); border-radius: 20px; padding: 7px 15px;
    font-size: 12.5px; cursor: pointer; font-family: inherit;
    transition: border-color .18s, color .18s, transform .18s var(--ease);
  }
  .suggestion:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

  .msg { margin-bottom: 26px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    max-width: 78%; background: var(--accent); color: var(--accent-ink);
    padding: 11px 16px; border-radius: var(--r-lg) var(--r-lg) 4px var(--r-lg);
    white-space: pre-wrap; word-break: break-word;
    box-shadow: var(--shadow);
  }

  /* 回答卡片 */
  .answer-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden;
  }
  .answer-body { padding: 20px 22px; }
  /* 答案正文由 renderMarkdown 渲染成块级元素，所以这里用常规空白处理（不再是 pre-wrap） */
  .answer-body .txt { word-break: break-word; line-height: 1.78; }
  .answer-body .txt > :first-child { margin-top: 0; }
  .answer-body .txt > :last-child { margin-bottom: 0; }
  .answer-body .txt p { margin: 0 0 14px; }

  /* 标题：层级分明但不喧宾夺主 */
  .answer-body .txt h1, .answer-body .txt h2, .answer-body .txt h3,
  .answer-body .txt h4, .answer-body .txt h5, .answer-body .txt h6 {
    margin: 24px 0 10px; font-weight: 600; line-height: 1.4; letter-spacing: -.01em;
  }
  .answer-body .txt h1 { font-size: 19px; }
  .answer-body .txt h2 { font-size: 17px; }
  .answer-body .txt h3 { font-size: 15.5px; }
  .answer-body .txt h4, .answer-body .txt h5, .answer-body .txt h6 { font-size: 14.5px; color: var(--ink-2); }

  /* 列表：序号用强调色，看起来更像一篇排版过的文档 */
  .answer-body .txt ol, .answer-body .txt ul { margin: 0 0 14px; padding-left: 24px; }
  .answer-body .txt li { margin: 6px 0; padding-left: 2px; }
  .answer-body .txt li::marker { color: var(--accent); }
  .answer-body .txt li > ul, .answer-body .txt li > ol { margin: 6px 0 0; }

  .answer-body .txt strong { font-weight: 600; }
  .answer-body .txt em { font-style: italic; color: var(--ink-2); }

  .answer-body .txt code {
    font-family: var(--font-mono); font-size: .88em; padding: 1px 5px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px;
  }
  .answer-body .txt pre {
    margin: 0 0 14px; padding: 12px 14px; overflow-x: auto;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm);
  }
  .answer-body .txt pre code {
    padding: 0; border: none; background: none; font-size: 12.5px; line-height: 1.6;
  }

  .answer-body .txt a {
    color: var(--accent); text-decoration: none;
    border-bottom: 1px solid var(--accent-soft);
  }
  .answer-body .txt a:hover { border-bottom-color: var(--accent); }

  .answer-body .txt blockquote {
    margin: 0 0 14px; padding: 10px 16px; color: var(--ink-2);
    border-left: 3px solid var(--accent); background: var(--accent-soft);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
  }
  .answer-body .txt hr { margin: 22px 0; border: none; border-top: 1px solid var(--line); }

  /* 答案配图：做成带标号与图注的图卡，并用一条分隔线把它和正文分开，
     避免几张裸图突然堆在末尾显得突兀 */
  .answer-figs { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .answer-figs:empty { display: none; }
  .figs-head {
    margin-bottom: 12px; font-size: 11.5px; letter-spacing: .08em;
    color: var(--ink-dim); font-family: var(--font-mono);
  }
  .figs-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .fig {
    margin: 0; overflow: hidden; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: var(--r-md);
  }
  .fig img { width: 100%; display: block; cursor: zoom-in; background: var(--bg); }
  .fig figcaption {
    padding: 9px 12px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
    border-top: 1px solid var(--line);
  }
  /* 切片标题常自带章节号（如「3.4.1 装入全幅烫金膜盒」），
     与「图 N」编号挨太近会被读成一个数字，所以上面把间距留大到 9px */
  .fig-no {
    display: inline-block; margin-right: 9px; padding: 1px 7px;
    font-family: var(--font-mono); font-size: 11px; border-radius: 999px;
    color: var(--accent); background: var(--accent-soft);
  }

  /* 访问密钥登录层：任何接口返回 401 时弹出 */
  .login-mask {
    position: fixed; inset: 0; z-index: 60; display: flex;
    align-items: center; justify-content: center; padding: 20px;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(3px);
  }
  .login-mask[hidden] { display: none; }
  .login-box {
    width: 100%; max-width: 340px; padding: 24px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-md); box-shadow: var(--shadow);
  }
  .login-box h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  .login-box p { margin: 0 0 16px; font-size: 12.5px; color: var(--ink-dim); }
  .login-box input {
    width: 100%; margin-bottom: 12px; padding: 8px 10px; font-size: 13px;
    color: var(--ink); background: var(--surface-2); font-family: var(--font-mono);
    border: 1px solid var(--line); border-radius: var(--r-sm);
  }
  .login-box input:focus { outline: none; border-color: var(--accent); }
  .login-btn {
    width: 100%; padding: 8px; cursor: pointer; font-size: 13px;
    color: var(--accent-ink); background: var(--accent);
    border: 1px solid var(--accent); border-radius: var(--r-sm);
    transition: opacity .18s;
  }
  .login-btn:hover:not(:disabled) { opacity: .88; }
  .login-btn:disabled { opacity: .5; cursor: not-allowed; }
  .login-err { margin-top: 10px; font-size: 12.5px; color: var(--fail); min-height: 17px; }
  .caret {
    display: inline-block; width: 8px; height: 16px; margin-left: 1px;
    background: var(--accent); vertical-align: -3px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0 } }

  /* ============================================================
     签名元素：检索管线
     把「四路并行检索汇聚成一条答案」这个真实结构画出来
     ============================================================ */
  .pipeline {
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface-2) 60%, var(--surface));
  }
  .pipeline-head {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 18px; cursor: pointer; user-select: none;
    transition: background .18s;
  }
  .pipeline-head:hover { background: var(--accent-soft); }
  .pipeline-head .chev {
    width: 11px; height: 11px; flex-shrink: 0; color: var(--ink-dim);
    transition: transform .25s var(--ease);
  }
  .pipeline.open .pipeline-head .chev { transform: rotate(90deg); }
  .pipeline-head .title { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
  .pipeline-head .count { font-size: 11.5px; color: var(--ink-dim); margin-left: auto; }
  .pipeline-head .count .mono { color: var(--ink-2); }

  .pipeline-body {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
    max-height: 0; overflow: hidden;
    transition: max-height .34s var(--ease);
  }
  .pipeline.open .pipeline-body { max-height: 620px; }

  /* 泳道分组：左侧竖排分组名 + 右侧节点 */
  .lane {
    display: grid;
    grid-template-columns: 88px 1fr;
    align-items: stretch;
  }
  .lane + .lane { border-top: 1px dashed var(--line); }
  .lane-label {
    padding: 11px 14px 11px 18px;
    font-size: 10px; letter-spacing: .2em;
    color: var(--ink-dim); font-family: var(--font-mono);
    border-right: 1px solid var(--line);
    display: flex; align-items: center;
    line-height: 1.4;
  }
  .lane-nodes { padding: 7px 18px 7px 16px; display: flex; flex-wrap: wrap; gap: 7px; }

  .node {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px 5px 9px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--surface-2);
    font-size: 12px; color: var(--ink-dim);
    font-family: var(--font-mono);
    transition: all .2s var(--ease);
  }
  .node .mark {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--line-strong); flex-shrink: 0;
    transition: background .2s;
  }
  .node.done {
    color: var(--ink); border-color: color-mix(in srgb, var(--done) 32%, var(--line));
    background: color-mix(in srgb, var(--done) 7%, var(--surface-2));
  }
  .node.done .mark { background: var(--done); }
  .node.live {
    color: var(--live); border-color: color-mix(in srgb, var(--live) 45%, transparent);
    background: color-mix(in srgb, var(--live) 9%, var(--surface-2));
  }
  .node.live .mark { background: var(--live); animation: pulse 1.1s ease-in-out infinite; }

  /* 收敛行：RRF → 重排 → 生成 是一条线，用底色暗示它是单个流程而非并行 */
  .lane.funnel .lane-nodes { background: color-mix(in srgb, var(--accent) 4%, transparent); }

  /* ============================================================
     输入区
     ============================================================ */
  .composer {
    flex-shrink: 0; border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(10px);
    padding: 14px 22px 17px;
  }
  .composer .inner { max-width: 860px; margin: 0 auto; }
  .field {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 13px; padding: 7px 7px 7px 14px;
    transition: border-color .2s, box-shadow .2s;
  }
  .field:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #input {
    flex: 1; resize: none; border: none; background: none; outline: none;
    color: var(--ink); font-family: inherit; font-size: 14.5px; line-height: 1.65;
    min-height: 26px; max-height: 148px; padding: 5px 0;
  }
  #input::placeholder { color: var(--ink-dim); }
  #send {
    flex-shrink: 0; height: 34px; padding: 0 17px;
    border: none; border-radius: 9px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    font-family: inherit; font-size: 13.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 7px;
    transition: opacity .18s, transform .18s var(--ease);
  }
  #send:hover:not(:disabled) { transform: translateY(-1px); }
  #send:disabled { opacity: .4; cursor: not-allowed; }
  #send .ico { width: 13px; height: 13px; }

  .composer .foot {
    display: flex; align-items: center; gap: 10px;
    margin-top: 9px; padding: 0 2px;
    font-size: 11.5px; color: var(--ink-dim);
  }
  .composer .foot .kbd {
    font-family: var(--font-mono); font-size: 10.5px;
    border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; color: var(--ink-dim);
  }
  .composer .foot .spacer { flex: 1; }

  /* 滚动条 */
  #chat::-webkit-scrollbar { width: 9px; }
  #chat::-webkit-scrollbar-thumb {
    background: var(--line-strong); border-radius: 5px;
    border: 2px solid var(--bg);
  }
  #chat::-webkit-scrollbar-thumb:hover { background: var(--ink-dim); }
  #chat::-webkit-scrollbar-track { background: transparent; }

  /* 响应式：窄屏收起泳道分组名，避免挤压节点 */
  @media (max-width: 620px) {
    .column, .composer .inner { padding-left: 14px; padding-right: 14px; }
    .topbar { padding: 11px 14px; gap: 10px; }
    .brand .sub { display: none; }
    .lane { grid-template-columns: 1fr; }
    .lane-label {
      border-right: none; border-bottom: 1px solid var(--line);
      padding: 7px 14px 4px;
    }
    .lane-nodes { padding: 8px 14px; }
    .switch .label { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    #chat { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark">掌</div>
    <div>
      <div class="name">掌柜智库</div>
      <div class="sub">产品文档知识库</div>
    </div>
  </div>
  <span class="spacer"></span>
  <div class="ctl-group">
    <label class="switch" title="开启后答案逐字输出，并实时显示检索进度">
      <input type="checkbox" id="streamToggle" checked>
      <span class="track"></span>
      <span class="label">流式</span>
    </label>
    <button class="theme-btn" id="themeBtn" title="切换昼夜模式" aria-label="切换昼夜模式">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">连接中</span></span>
  </div>
</header>

<main id="chat"><div class="column" id="column"></div></main>

<!-- 访问密钥登录层：接口返回 401 时弹出 -->
<div class="login-mask" id="loginMask" hidden>
  <div class="login-box">
    <h2>需要访问密钥</h2>
    <p>请输入分配给你的访问密钥</p>
    <input id="loginKey" type="password" placeholder="访问密钥" autocomplete="current-password">
    <button class="login-btn" id="loginBtn">进入</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<footer class="composer">
  <div class="inner">
    <div class="field">
      <textarea id="input" rows="1" placeholder="描述你的问题，例如：烫金膜盒怎么安装？"></textarea>
      <button id="send">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        <span>发送</span>
      </button>
    </div>
    <div class="foot">
      <span class="kbd">Enter</span><span>发送</span>
      <span class="kbd">Shift + Enter</span><span>换行</span>
      <span class="spacer"></span>
      <span id="hint">就绪</span>
    </div>
  </div>
</footer>

<script>
'use strict';

/* ============================================================
   状态
   ============================================================ */
let sessionId = 'sess_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
let eventSource = null;
let busy = false;

const $ = (id) => document.getElementById(id);

/* ============================================================
   访问鉴权：包一层 fetch，任何请求返回 401 就弹登录框
   —— 页面上的调用点一处都不用改
   ============================================================ */
const _origFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const res = await _origFetch(...args);
  if (res.status === 401) showLogin();
  return res;
};

function showLogin() {
  const m = $('loginMask');
  if (m.hidden) { m.hidden = false; $('loginKey').focus(); }
}

async function doLogin() {
  const key = $('loginKey').value.trim();
  const err = $('loginErr');
  if (!key) { err.textContent = '请输入访问密钥'; return; }

  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = '校验中…';
  err.textContent = '';
  try {
    const r = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key }),
    });
    if (!r.ok) { err.textContent = '密钥无效或已撤销'; return; }
    // 服务端已种下 Cookie，重新加载即可带着身份跑
    location.reload();
  } catch (e) {
    err.textContent = '无法连接服务';
  } finally {
    btn.disabled = false; btn.textContent = '进入';
  }
}

$('loginBtn').onclick = doLogin;
$('loginKey').onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
const column = $('column');

/* ============================================================
   检索管线的结构定义
   这是本页面的签名元素：把「四路并行 → 汇聚」的真实图结构画出来。
   分组依据是 app/query_process/agent/main_graph.py 的实际拓扑：
     node_multi_search 分叉出 4 路，再汇入 node_join，
     之后 RRF → 重排 → 生成 是单线收敛。
   节点名用后端下发的中文名（task_utils._NODE_NAME_TO_CN 映射后的值）。
   ============================================================ */
const PIPELINE = [
  { label: 'PLAN',   nodes: ['确认问题产品'] },
  { label: 'RECALL', parallel: true, nodes: ['切片搜索', '切片搜索(假设性文档)', '查询知识图谱', '网络搜索'] },
  { label: 'FUNNEL', funnel: true, nodes: ['倒排融合', '重排序', '生成答案'] },
];
const ALL_NODES = PIPELINE.flatMap(g => g.nodes);

const STATUS_CN = { pending: '排队中', processing: '检索中', completed: '已完成', failed: '失败' };

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ============================================================
   极简 Markdown 渲染
   覆盖：标题、代码块、粗体/斜体/行内代码、链接、有序/无序列表（含一层嵌套）、
   引用块、分隔线、段落。
   **先整体 esc 再解析**——答案里可能夹着文档正文，不转义就等于把切片内容当标签执行。
   注意 esc 之后 ">" 已变成 "&gt;"，所以引用块要用转义后的写法判断。
   ============================================================ */
function inlineMd(s) {
  // 先把行内代码抽出来占位，否则里面的 * 会被后面当成粗体解析
  const codes = [];
  let t = s.replace(/`([^`]+)`/g, (m, c) => {
    codes.push(c);
    return '\u0000' + (codes.length - 1) + '\u0000';
  });
  t = t
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    // 粗体已经先被吃掉，剩下的 *…* 当斜体；不加左边界断言，
    // 否则 "中文标点*斜体*" 这种写法（前面不是空格）会漏掉
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    // 只放行 http(s) 与本域路径，挡掉 javascript: 之类的伪协议
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) =>
      /^(https?:\/\/|\/)/i.test(url)
        ? `<a href="${url}" target="_blank" rel="noopener">${text}</a>`
        : m);
  return t.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[+i] + '</code>');
}

function renderMarkdown(md) {
  const out = [];
  let list = null;    // { tag: 'ol'|'ul', items: [{text, subs: []}] }
  let para = [];
  let fence = null;   // 代码围栏内的行，围栏里一律不做 Markdown 解析

  const flushPara = () => {
    if (para.length) { out.push('<p>' + inlineMd(para.join('<br>')) + '</p>'); para = []; }
  };
  const flushList = () => {
    if (!list) return;
    const body = list.items.map(it =>
      '<li>' + inlineMd(it.text) +
      (it.subs.length
        ? '<ul>' + it.subs.map(s => '<li>' + inlineMd(s) + '</li>').join('') + '</ul>'
        : '') +
      '</li>').join('');
    out.push('<' + list.tag + '>' + body + '</' + list.tag + '>');
    list = null;
  };
  const pushItem = (tag, text) => {
    if (list && list.tag !== tag) {
      // 有序列表后紧跟的无序项按「嵌套」处理（模型就是这样表达子步骤的）
      if (tag === 'ul' && list.tag === 'ol' && list.items.length) {
        list.items[list.items.length - 1].subs.push(text);
        return;
      }
      flushList();
    }
    if (!list) list = { tag, items: [] };
    list.items.push({ text, subs: [] });
  };

  for (const raw of esc(md || '').split('\n')) {
    const line = raw.replace(/\s+$/, '');   // 行尾双空格是 Markdown 的硬换行标记，去掉
    const t = line.trim();

    if (t.startsWith('```')) {              // 围栏开合
      if (fence === null) { flushPara(); flushList(); fence = []; }
      else { out.push('<pre><code>' + fence.join('\n') + '</code></pre>'); fence = null; }
      continue;
    }
    if (fence !== null) { fence.push(line); continue; }

    if (!t) { flushPara(); flushList(); continue; }

    const h  = t.match(/^(#{1,6})\s+(.+)$/);
    const hr = /^(-{3,}|\*{3,}|_{3,})$/.test(t);
    const ol = t.match(/^\d+\.\s+(.+)$/);
    const ul = t.match(/^[-*]\s+(.+)$/);
    const bq = t.match(/^&gt;\s?(.*)$/);

    if (h) {
      flushPara(); flushList();
      const lv = h[1].length;
      out.push('<h' + lv + '>' + inlineMd(h[2]) + '</h' + lv + '>');
    } else if (hr) {
      flushPara(); flushList(); out.push('<hr>');
    } else if (ol || ul) {
      flushPara();
      pushItem(ol ? 'ol' : 'ul', (ol ? ol[1] : ul[1]).trim());
    } else if (bq) {
      flushPara(); flushList();
      out.push('<blockquote>' + inlineMd(bq[1].trim()) + '</blockquote>');
    } else {
      flushList();
      para.push(t);
    }
  }
  flushPara(); flushList();
  if (fence !== null && fence.length) {     // 流式中途被截断的围栏，也要收尾
    out.push('<pre><code>' + fence.join('\n') + '</code></pre>');
  }
  return out.join('');
}

/* 把文本渲染进答案区；流式过程中在末尾补一个光标 */
function paintAnswer(ctx, text, withCaret) {
  ctx.txt.innerHTML = renderMarkdown(text);
  if (!withCaret) return;
  const c = document.createElement('span');
  c.className = 'caret';
  (ctx.txt.lastElementChild || ctx.txt).appendChild(c);
}

/* ============================================================
   主题
   ============================================================ */
$('themeBtn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('kb-theme', next); } catch (e) {}
};

/* 跟随系统切换（仅当用户未手动选择过） */
try {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    if (localStorage.getItem('kb-theme')) return;
    document.documentElement.dataset.theme = e.matches ? 'dark' : 'light';
  });
} catch (e) {}

/* ============================================================
   连接状态
   ============================================================ */
function setConn(text, cls) {
  $('connText').textContent = text;
  $('conn').className = 'conn' + (cls ? ' ' + cls : '');
}

function scrollDown() {
  const chat = $('chat');
  chat.scrollTop = chat.scrollHeight;
}

/* ============================================================
   空状态
   ============================================================ */
const SUGGESTIONS = [
  '烫金膜盒怎么安装？',
  '打印质量不清晰怎么办？',
  '这款设备支持哪些纸张？',
  '如何更换电池？',
];

function renderEmpty() {
  column.innerHTML = `
    <div class="empty-state">
      <div class="eyebrow">Knowledge Base</div>
      <h2>问点什么吧</h2>
      <p>已收录产品使用文档。提问后可以看到检索路径：哪些资料被命中、如何重排、答案从何而来。</p>
      <div class="suggestions">
        ${SUGGESTIONS.map(s => `<button class="suggestion">${esc(s)}</button>`).join('')}
      </div>
    </div>`;
  column.querySelectorAll('.suggestion').forEach(b => {
    b.onclick = () => { $('input').value = b.textContent; send(); };
  });
}
renderEmpty();

/* ============================================================
   创建一轮对话的 DOM
   ============================================================ */
function addUser(text) {
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  column.appendChild(el);
  scrollDown();
}

function addAnswer() {
  const el = document.createElement('div');
  el.className = 'msg bot';

  const lanes = PIPELINE.map(g => `
    <div class="lane${g.funnel ? ' funnel' : ''}">
      <div class="lane-label">${g.label}</div>
      <div class="lane-nodes">
        ${g.nodes.map(n => `<span class="node" data-node="${esc(n)}"><span class="mark"></span>${esc(n)}</span>`).join('')}
      </div>
    </div>`).join('');

  el.innerHTML = `
    <div class="answer-card">
      <div class="pipeline" id="pipe">
        <div class="pipeline-head" id="pipeHead" role="button" tabindex="0"
             aria-expanded="false" aria-controls="pipeBody">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          <span class="title" id="pipeTitle">正在检索资料…</span>
          <span class="count"><span class="mono" id="pipeCount">0</span> / ${ALL_NODES.length}</span>
        </div>
        <div class="pipeline-body" id="pipeBody">${lanes}</div>
      </div>
      <div class="answer-body"><div class="txt" id="txt"></div></div>
      <div class="answer-figs" id="figs"></div>
    </div>`;

  column.appendChild(el);
  scrollDown();

  const pipe = el.querySelector('#pipe');
  const head = el.querySelector('#pipeHead');
  const toggle = () => {
    const open = pipe.classList.toggle('open');
    head.setAttribute('aria-expanded', String(open));
  };
  head.onclick = toggle;
  head.onkeydown = (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  };

  return {
    el,
    pipe,
    head,
    title: el.querySelector('#pipeTitle'),
    count: el.querySelector('#pipeCount'),
    txt: el.querySelector('#txt'),
    figs: el.querySelector('#figs'),
    buf: '',            // 流式累积的答案原文，每次重渲染整段
  };
}

/* 渲染答案配图：带标号与图注的图卡；点图在新标签页看原图 */
function renderImages(ctx, images) {
  const list = images || [];
  if (!list.length) { ctx.figs.innerHTML = ''; return; }
  ctx.figs.innerHTML =
    `<div class="figs-head">相关图片 · ${list.length} 张</div>` +
    '<div class="figs-grid">' +
    list.map((it, i) => `
      <figure class="fig">
        <img src="${esc(it.url)}" alt="${esc(it.caption || '参考图片')}" loading="lazy"
             onclick="window.open(this.src,'_blank')">
        <figcaption><span class="fig-no">图 ${i + 1}</span>${esc(it.caption || '未标注来源')}</figcaption>
      </figure>`).join('') +
    '</div>';
}

/* ============================================================
   渲染管线进度
   ============================================================ */
function renderPipeline(ctx, doneList, runningList) {
  const done = new Set(doneList || []);
  const live = new Set(runningList || []);

  ctx.el.querySelectorAll('.node').forEach(node => {
    const name = node.dataset.node;
    node.classList.toggle('done', done.has(name));
    node.classList.toggle('live', !done.has(name) && live.has(name));
  });

  const n = ALL_NODES.filter(x => done.has(x)).length;
  ctx.count.textContent = n;

  if (live.size) {
    ctx.title.textContent = '正在检索资料…';
  } else if (n >= ALL_NODES.length) {
    ctx.title.textContent = '检索完成';
  }
  return n;
}

/* ============================================================
   发送
   ============================================================ */
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 148) + 'px';
});
$('send').onclick = send;

async function send() {
  const query = $('input').value.trim();
  if (!query || busy) return;

  const isStream = $('streamToggle').checked;
  busy = true;
  $('send').disabled = true;
  $('input').value = '';
  $('input').style.height = 'auto';
  $('hint').textContent = '处理中…';

  // 首次提问时清掉空状态
  const empty = column.querySelector('.empty-state');
  if (empty) column.innerHTML = '';

  addUser(query);
  const ctx = addAnswer();
  ctx.pipe.classList.add('open');          // 检索过程中默认展开，让过程可见
  ctx.head.setAttribute('aria-expanded', 'true');

  if (isStream) await streamFlow(query, ctx);
  else await syncFlow(query, ctx);
}

/* 流式：先订阅 SSE，再提交问题 —— 顺序不能反，否则早期进度事件会推给尚未创建的队列 */
async function streamFlow(query, ctx) {
  setConn('订阅中', 'busy');

  if (eventSource) { eventSource.close(); eventSource = null; }
  eventSource = new EventSource(`/stream/${sessionId}`);

  eventSource.addEventListener('ready', () => {
    setConn('已连接', 'busy');
  });

  eventSource.addEventListener('progress', (e) => {
    const d = JSON.parse(e.data);
    renderPipeline(ctx, d.done_list, d.running_list);
  });

  eventSource.addEventListener('delta', (e) => {
    const d = JSON.parse(e.data);
    // 整段重渲染而不是追加文本节点：Markdown 是上下文相关的（列表要凑齐才能成块）
    ctx.buf += (d.delta ?? d.text ?? '');
    paintAnswer(ctx, ctx.buf, true);
    scrollDown();
  });

  eventSource.addEventListener('final', (e) => {
    const d = JSON.parse(e.data);
    ctx.buf = d.answer || '';
    paintAnswer(ctx, ctx.buf, false);
    renderImages(ctx, d.images);
    // 收尾：最后一个 progress 可能早于 final 到达（那时 status 仍是 processing），
    // 所以在这里补一次完成态，保证泳道与标题都是最终状态
    const n = renderPipeline(ctx, ALL_NODES, []);
    ctx.title.textContent = '检索完成';
    ctx.count.textContent = n;
    ctx.pipe.classList.remove('open');     // 收起过程，让答案占主视野
    ctx.head.setAttribute('aria-expanded', 'false');
    setConn('已完成', 'on');
    $('hint').textContent = '就绪';
    finish();
  });

  eventSource.addEventListener('error', (e) => {
    let msg = '连接异常';
    try { if (e.data) msg = JSON.parse(e.data).error || msg; } catch (_) {}
    ctx.title.textContent = '检索出错';
    ctx.title.style.color = 'var(--fail)';
    ctx.txt.textContent = msg;
    setConn('异常', 'err');
    finish();
  });

  eventSource.onerror = () => {
    if (busy) setConn('连接中断', 'err');
  };

  await new Promise(r => setTimeout(r, 250));
  try {
    const r = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, session_id: sessionId, is_stream: true }),
    });
    const d = await r.json();
    if (d.session_id) sessionId = d.session_id;
  } catch (e) {
    ctx.title.textContent = '提交失败';
    ctx.title.style.color = 'var(--fail)';
    ctx.txt.textContent = '无法连接后端服务，请确认已启动（端口 8002）。';
    setConn('未连接', 'err');
    finish();
  }
}

/* 非流式：一次请求拿完整答案 */
async function syncFlow(query, ctx) {
  setConn('检索中', 'busy');
  ctx.pipe.classList.remove('open');
  ctx.head.setAttribute('aria-expanded', 'false');
  ctx.txt.textContent = '正在检索并生成答案…';
  try {
    const r = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, session_id: sessionId, is_stream: false }),
    });
    const d = await r.json();
    if (d.session_id) sessionId = d.session_id;
    paintAnswer(ctx, d.answer || '（未返回答案）', false);
    renderImages(ctx, d.images);
    if (d.done_list && d.done_list.length) {
      const n = renderPipeline(ctx, d.done_list, []);
      ctx.title.textContent = '检索完成';
      ctx.count.textContent = n;
    }
    setConn('已完成', 'on');
    $('hint').textContent = '就绪';
  } catch (e) {
    ctx.title.textContent = '请求失败';
    ctx.title.style.color = 'var(--fail)';
    ctx.txt.textContent = '无法连接后端服务，请确认已启动（端口 8002）。';
    setConn('未连接', 'err');
  }
  finish();
}

function finish() {
  if (eventSource) { eventSource.close(); eventSource = null; }
  busy = false;
  $('send').disabled = false;
  $('input').focus();
  scrollDown();
}

/* ============================================================
   启动时探测后端
   ============================================================ */
(async function ping() {
  try {
    const d = await (await fetch('/health')).json();
    setConn(d.ok ? '就绪' : '异常', d.ok ? 'on' : 'err');
  } catch (_) {
    setConn('未连接', 'err');
    $('hint').textContent = '后端未启动 · 端口 8002';
  }
})();
</script>
</body>
</html>
